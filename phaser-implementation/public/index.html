<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Cops and Robbers</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="landing-card">
            <h1>Cops and Robbers</h1>
            <p>Create a game, then send the link to a friend so they can join.</p>
            <button id="create-button" class="primary-button">Create Game</button>
            <div id="result" hidden>
                <p>Share this link:</p>
                <div class="game-link-row">
                    <input id="game-link" type="text" readonly>
                    <button id="copy-button" class="primary-button">Copy</button>
                </div>
                <p><a id="join-link" href="#">Go to game &rarr;</a></p>
            </div>
        </div>
        <script src="js/create.js"></script>
    </body>
</html>
